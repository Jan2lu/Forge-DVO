<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>Forge Davao</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, fixed bottom tab bar. The whiteboard is the hero of Today; dues are a scan-and-act list for coaches. */
:root{
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#E8E1D5; --surface:#F1ECE2; --raise:#FBF8F2; --ink:#103A39; --muted:#4F6663; --line:#CDC3B2;
  --accent:#103A39; --on-accent:#E7D8CB; --khaki:#DDCABC;
  --board:#FBF8F2; --board-ink:#103A39; --board-mute:#52695F; --frame:#9FB0A8;
  --ok:#176B3C; --ok-bg:#D5EBDC; --warn:#85490A; --warn-bg:#F3E1BD; --bad:#A81E17; --bad-bg:#F5D6D2;
  --focus:#1D5FD1; --scrim:rgba(6,20,19,.58);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1B1A; --surface:#0F2827; --raise:#153331; --ink:#E9DED1; --muted:#9BB0A9; --line:#25443F;
  --accent:#DDCABC; --on-accent:#103A39; --khaki:#DDCABC;
  --board:#153331; --board-ink:#EADFD2; --board-mute:#9BB0A9; --frame:#3C5E57;
  --ok:#62CF90; --ok-bg:#12301F; --warn:#F2B75B; --warn-bg:#35290F; --bad:#F48C83; --bad-bg:#3B1613;
  --focus:#7AA7F5; --scrim:rgba(0,0,0,.66); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1B1A; --surface:#0F2827; --raise:#153331; --ink:#E9DED1; --muted:#9BB0A9; --line:#25443F;
  --accent:#DDCABC; --on-accent:#103A39; --khaki:#DDCABC;
  --board:#153331; --board-ink:#EADFD2; --board-mute:#9BB0A9; --frame:#3C5E57;
  --ok:#62CF90; --ok-bg:#12301F; --warn:#F2B75B; --warn-bg:#35290F; --bad:#F48C83; --bad-bg:#3B1613;
  --focus:#7AA7F5; --scrim:rgba(0,0,0,.66); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.shell{max-width:640px;margin:0 auto;padding:14px 0 120px}
.shell>*+*{margin-top:0}
h2,h3,h4,p,ul,pre{margin:0}
ul{list-style:none;padding:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.logo{height:46px;width:auto;border-radius:5px;display:block}
.tag{font:800 14px/1 var(--font-display);letter-spacing:.14em;background:var(--accent);color:var(--on-accent);padding:4px 7px 3px;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.mename{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#who{max-width:180px;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}

/* common */
.sec{font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.sec-row:first-child{margin-top:4px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:14px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.stack{display:grid;gap:10px}
.btn{min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.ic{min-width:44px;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.pill{display:inline-flex;align-items:center;font:600 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:4px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mute{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.hyrox,.pill.pin{background:var(--accent);color:var(--on-accent)}
.note{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:6px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.empty b{display:block;color:var(--ink);font:800 20px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.empty .btn{margin-top:12px}

/* coach strip */
.strip{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:14px;cursor:pointer;text-align:left}
.strip b{font:700 18px var(--font-mono)}
.strip .go{margin-left:auto;font-weight:800;color:var(--bg)}

/* whiteboard */
.board{background:var(--board);color:var(--board-ink);border:3px solid var(--frame);border-radius:6px;padding:14px 16px 16px}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tape{display:inline-block;background:var(--accent);color:var(--on-accent);font:800 14px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;padding:5px 10px 4px;transform:rotate(-1.5deg)}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .ic{min-width:40px;min-height:40px;font-size:20px;border-color:var(--frame);color:var(--board-ink)}
.datenav .ic:disabled{opacity:.35}
.datelabel{min-height:40px;padding:0 10px;background:transparent;border:0;font:600 13px var(--font-mono);color:var(--board-ink);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.board h3{font:800 36px/0.95 var(--font-display);text-transform:uppercase;letter-spacing:.01em;margin:14px 0 8px;text-wrap:balance}
.briefing{border-left:3px solid var(--accent);padding-left:10px;margin:12px 0 4px;white-space:pre-wrap}
.blk{margin-top:14px}
.blk+.blk{border-top:1px dashed var(--frame);padding-top:14px}
.board .blk h4{font:600 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--board-mute);margin-bottom:6px}
.board pre{font:500 15px/1.55 var(--font-mono);white-space:pre-wrap;word-break:break-word}
.board-actions{margin-top:16px;display:flex;gap:8px}
.board .btn.ghost{border-color:var(--frame);color:var(--board-ink)}
.board .empty{border-color:var(--frame);margin-top:14px}
.board .empty b{color:var(--board-ink)}

/* lists */
.list{border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.up{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;width:100%;background:transparent;border:0;text-align:left;padding:12px 0;cursor:pointer}
.up .t{font:500 18px var(--font-mono)}
.t small{font-size:11px;margin-left:3px;color:var(--muted)}
.up .nm,.nm{font-weight:600}
.sub{display:block;font-size:13px;color:var(--muted)}
.day-lab{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}

/* classes */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.day{flex:0 0 auto;min-width:56px;min-height:60px;border:1px solid var(--line);background:var(--raise);border-radius:6px;display:grid;place-items:center;padding:6px 8px;cursor:pointer;gap:0}
.day span{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day b{font:800 24px/1 var(--font-display)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-pressed="true"] span{color:var(--bg)}
.day[aria-pressed="true"] b{color:var(--bg)}
.cls{display:grid;grid-template-columns:78px 1fr;gap:6px 12px;padding:14px 0}
.cls .t{font:500 20px/1.1 var(--font-mono)}
.cls .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cls .head .nm{font-size:17px}
.cls .foot{grid-column:1/-1;display:flex;align-items:center;gap:12px;justify-content:space-between}
.capwrap{flex:1;min-width:0}
.cap{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.cap i{display:block;height:100%;background:var(--ink)}
.cap.full i{background:var(--bad)}
.capnum{font:500 12px var(--font-mono);color:var(--muted);margin-top:4px}
.who-in{font-size:13px;color:var(--muted);grid-column:1/-1;overflow-wrap:anywhere}

/* segmented */
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--raise);margin-bottom:12px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:0 0 auto;min-height:38px;padding:0 12px;border:1px solid var(--line);background:var(--raise);border-radius:19px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* PRs */
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;width:100%;background:transparent;border:0;text-align:left;cursor:pointer;align-items:center}
.pr .val{font:500 24px/1 var(--font-mono);text-align:right}
.rank{font:800 26px/1 var(--font-display);width:34px;color:var(--muted)}
.rank.r1{color:var(--ink)}
.lb{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 0}
.lb .val{font:500 20px var(--font-mono)}
.feed{padding:12px 0;display:grid;gap:2px}

/* dues */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:10px 10px 8px;min-width:0}
.stat span{font:600 10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.stat b{font:800 28px/1.1 var(--font-display);display:block;overflow-wrap:anywhere}
.stat small{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
.drow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:12px 0 12px 12px;border-left:4px solid var(--line)}
.drow.st-overdue{border-left-color:var(--bad)}
.drow.st-soon{border-left-color:var(--warn)}
.drow.st-ok{border-left-color:var(--ok)}
.drow-main{background:transparent;border:0;text-align:left;padding:0;cursor:pointer;min-width:0}
.drow-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

/* news */
.ann h3{font:800 24px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.02em;margin:8px 0 6px;text-wrap:balance}
.ann p{white-space:pre-wrap;overflow-wrap:anywhere}
.ann .meta{font:500 12px var(--font-mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ann .acts{display:flex;gap:8px;margin-top:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* workout + board */
.wk-title{font:800 34px/.95 var(--font-display);text-transform:uppercase;text-wrap:balance}
.blkcard{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.blkcard h4{font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em}
.blkcard pre{font:500 15px/1.55 var(--font-mono);white-space:pre-wrap;word-break:break-word}
.blkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mylogs li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.lb.me{box-shadow:inset 3px 0 0 var(--accent);padding-left:10px}
.lb .val{white-space:nowrap}
.sec-row .datenav{flex-shrink:0}
.blkedit .two select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;min-height:42px}
.blkedit .two label{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
/* set cards (strength, accessory, skill) */
.scard{--raise:#14231e;--surface:#1d302a;--line:#2f453d;--ink:#f1ece0;--muted:#9fb3a8;--ok:#c9b68a;--bg:#14231e;background:#14231e;color:var(--ink);border:1px solid #2f453d;border-radius:16px;padding:18px 16px;display:grid;gap:14px}
.scard .btn:not(.danger){background:#c9b68a;color:#14231e;border-color:#c9b68a}
.scard .seg button[aria-pressed="true"]{background:#c9b68a;color:#14231e}
.scard .pill.ok{background:#c9b68a;color:#14231e}
.scard .sc-note,.scard .setin textarea{color:var(--ink)}
.sc-title{font:italic 800 32px/1 var(--font-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sc-sub{font:700 20px/1.25 var(--font-body);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:-6px}
.sc-demo{font:700 12px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ok);text-decoration:none;justify-self:start}
.sc-rx{font:800 28px/1 var(--font-display);letter-spacing:.06em;color:var(--ok)}
.sc-meta{font:600 13px var(--font-body);text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 52px;gap:8px}
.setrow.rep{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) 52px}
.setlab{display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:800 14px var(--font-body);color:var(--muted);text-transform:uppercase;min-height:60px}
.setin{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;justify-items:center;align-content:center;padding:6px 4px;min-width:0;min-height:60px}
.setin span{font:700 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setin input,.setin b{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:700 20px var(--font-body);padding:2px 0;color:var(--ink);min-height:30px;display:block}
.setin input::placeholder{color:var(--muted);opacity:.75}
.setin textarea{width:100%;border:0;background:transparent;font:500 16px var(--font-body);color:var(--ink);resize:vertical;min-height:70px;padding:6px 8px}
.setin.wide{grid-column:1/-1}
.setchk{border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);min-height:60px}
.setchk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.setchk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sc-note{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;width:100%;font-size:15px;min-height:44px}
.sc-quote{border-top:1px solid var(--line);padding-top:10px;font-style:italic;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.sc-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blkedit label{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:flex}
.tabs button{flex:1;min-width:0;min-height:60px;background:transparent;border:0;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;position:relative}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));outline:none}
.panel h3{font:800 26px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:14px}
.field{display:grid;gap:6px;margin-bottom:12px;min-width:0}
.field label{font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field small{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:16px;min-height:44px}
.field textarea{resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts-row .btn{flex:1 1 auto}
.blkedit{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--raise);display:grid;gap:8px}
.blkedit-head{display:flex;gap:8px}
.blkedit input,.blkedit textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:16px}
.blkedit textarea{font-family:var(--font-mono);font-size:14px}
.hist{border-top:1px solid var(--line);margin-top:6px}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.sched-day{font:800 18px var(--font-display);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.sched-row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sched-row .t{font:500 15px var(--font-mono)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;font-size:14px;font-weight:600;z-index:60;max-width:min(92vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:380px){.logo{height:40px}.stat b{font-size:24px}.two{grid-template-columns:1fr}}
</style>

function renderWho(){
  var sel=$('who');var ms=members().filter(function(m){return m.active});
  var sig=ms.map(function(m){return m.id+m.name}).join('|')+'|'+ui.who;
  if(sel.dataset.sig===sig)return;sel.dataset.sig=sig;
  if(ui.who&&!S.members[ui.who])ui.who=null;
  sel.innerHTML='<option value="">Who is training?</option>'+ms.map(function(m){return '<option value="'+esc(m.id)+'"'+(m.id===ui.who?' selected':'')+'>'+esc(m.name)+'</option>'}).join('');
}
function renderTabs(){
  $('tabs').innerHTML='<div class="tabs-in">'+TABS.map(function(t){
    return '<button data-act="tab" data-tab="'+t.id+'"'+(ui.tab===t.id?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t.icon+'</svg>'+t.label+'</button>'}).join('')+'</div>';
}
function render(){
  
  $('gear').hidden=!env.coach;
  $('who').hidden=!env.coach;$('meName').hidden=env.coach;
  renderWho();renderTabs();
  $('meName').textContent=(!env.coach&&ui.who&&S.members[ui.who])?S.members[ui.who].name:'';
  var v=$('view');
  var gated=env.mode==='auth'||env.mode==='pending'||env.mode==='rejected';
  $('tabs').hidden=gated;$('signout').hidden=!(env.mode==='live'||env.mode==='pending'||env.mode==='rejected');
  if(env.mode==='auth'){var sg='auth'+ui.authMode;if(v.dataset.sig!==sg){v.innerHTML=authView();v.dataset.sig=sg}return}
  v.dataset.sig='';
  if(gated){v.innerHTML=gatedView();return}
  if(env.mode==='loading'||(env.mode==='live'&&!env.expect.every(function(n){return env.loaded[n]}))){v.innerHTML='<div class="empty"><b>Loading the box</b>Pulling in today’s workout and schedule.</div>';return}
  if(env.mode==='live'&&env.errs.members){v.innerHTML='<div class="empty"><b>Cannot open gym data</b>Access to this app was changed or is unavailable. Reload the page, or ask a coach to share it with you again.</div>';return}
  if(!env.coach&&env.mode==='live'){
    if(!env.uid){v.innerHTML=authView();return}
    var mine=S.claims[env.uid];
    if(!mine||!S.members[mine.memberId]){v.innerHTML=claimView();return}
    ui.who=mine.memberId;$('meName').textContent=S.members[ui.who].name;
  }
  var banner=env.mode==='demo'?'<div class="banner">Demo mode with sample numbers. Nothing you do here is saved. To go live, add your Supabase keys in config.js (see the README).<br><button class="btn sm ghost" style="margin-top:8px" data-act="demo-role">'+(env.coach?'See the member view':'Back to coach view')+'</button></div>':'';
  if(env.coach&&env.mode==='live'){var pc=pendingProfiles().length;if(pc)banner+='<button class="strip" data-act="approvals"><b>'+pc+'</b> waiting for approval <span class="go">Review ›</span></button>'}
  var fn={today:viewToday,workout:viewWorkout,board:viewBoard,classes:viewClasses,prs:viewPrs,dues:viewDues,news:viewNews}[ui.tab];
  var ae=document.activeElement,fkey=null,ss=0,se=0;
  if(ae&&ae.dataset&&ae.dataset.fk&&v.contains(ae)){fkey=ae.dataset.fk;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e1){}}
  v.innerHTML=banner+fn();
  if(fkey){var re=v.querySelector('[data-fk="'+fkey.replace(/"/g,'')+'"]');if(re){re.focus();try{re.setSelectionRange(ss,se)}catch(e2){}}}
}

function viewToday(){
  var t=TODAY(),d=ui.wodDate||t,w=S.workouts[d],h='';
  var firstRun=!Object.keys(S.members).length&&!Object.keys(S.schedule).length&&!Object.keys(S.workouts).length;
  if(firstRun&&env.coach){return '<div class="empty"><b>Set up Forge Davao</b>Start with the weekly class schedule, then add members on the Dues tab and post today’s workout.<div class="acts-row" style="justify-content:center"><button class="btn accent" data-act="sched-mgr">Build class schedule</button><button class="btn ghost" data-act="wod-edit">Post a workout</button></div></div>'}
  if(env.coach){var c=duesCounts();if(c.overdue||c.soon)h+='<button class="strip" data-act="tab" data-tab="dues"><b>'+c.overdue+'</b> overdue <span>·</span> <b>'+c.soon+'</b> due soon <span class="go">Open dues ›</span></button>'}
  var label=d===t?'Today':d===addDays(t,1)?'Tomorrow':d===addDays(t,-1)?'Yesterday':fmtDate(d);
  h+='<section class="board" aria-label="Whiteboard"><div class="board-top"><span class="tape">Whiteboard</span><div class="datenav"><button class="ic" data-act="wod-shift" data-n="-1" aria-label="Previous day"'+(d<=addDays(t,-30)?' disabled':'')+'>‹</button><button class="datelabel" data-act="wod-today" aria-label="Jump to today">'+esc(label)+'</button><button class="ic" data-act="wod-shift" data-n="1" aria-label="Next day"'+(d>=addDays(t,14)?' disabled':'')+'>›</button></div></div>';
  if(w){
    h+='<h3>'+esc(w.title||'Workout of the day')+'</h3><span class="pill '+(w.track==='Hyrox'?'hyrox':'')+'">'+esc(w.track||'')+'</span>';
    if(w.briefing)h+='<p class="briefing">'+esc(w.briefing)+'</p>';
    (w.blocks||[]).forEach(function(b){h+='<div class="blk"><h4>'+esc(b.label)+'</h4><pre>'+esc(b.text)+'</pre></div>'});
    if(w.scaling)h+='<div class="blk"><h4>Scaling</h4><pre>'+esc(w.scaling)+'</pre></div>';
  }else{
    h+='<div class="empty"><b>Nothing on the board</b>'+(env.coach?'Post the workout so members can see it before class.':'The coaches have not posted '+(d===t?'today’s':'this day’s')+' workout yet.')+'</div>';
  }
  if(w||env.coach)h+='<div class="board-actions">'+(w?'<button class="btn sm ghost" data-act="tab" data-tab="workout">Log scores</button><button class="btn sm ghost" data-act="tab" data-tab="board">Leaderboard</button>':'')+(env.coach?'<button class="btn sm ghost" data-act="wod-edit">'+(w?'Edit workout':'Post workout')+'</button>':'')+'</div>';
  h+='</section>';

  var up=upcoming(3);
  h+='<div class="sec-row"><h2 class="sec">Next up</h2><button class="btn sm ghost" data-act="tab" data-tab="classes">All classes</button></div>';
  if(up.length){
    h+='<ul class="list">'+up.map(function(c){
      var rs=resvFor(c.id,c.date),mine=ui.who&&rs.some(function(r){return r.memberId===ui.who});
      var dl=c.date===t?'Today':c.date===addDays(t,1)?'Tomorrow':DOWF[c.day];
      return '<li><button class="up" data-act="goto-class" data-date="'+c.date+'"><span><span class="day-lab">'+dl+'</span><span class="t">'+timeHtml(c.time)+'</span></span><span><span class="nm">'+esc(c.name)+'</span><span class="sub">'+esc(c.coach||'')+' · '+Math.max(0,c.capacity-rs.length)+' of '+c.capacity+' spots open</span></span>'+(mine?'<span class="pill ok">You’re in</span>':'<span></span>')+'</button></li>'}).join('')+'</ul>';
  }else h+='<div class="empty">No upcoming classes on the schedule.</div>';

  var anns=annList();
  if(anns.length){var a=anns[0];
    h+='<div class="sec-row"><h2 class="sec">From the coaches</h2><button class="btn sm ghost" data-act="tab" data-tab="news">All news</button></div><div class="card ann"><div class="meta">'+(a.pinned?'<span class="pill pin">Pinned</span>':'')+'<span>'+esc(fmtShort(a.createdAt.slice(0,10)))+'</span></div><h3>'+esc(a.title)+'</h3><p class="clamp">'+esc(a.body)+'</p></div>';
  }
  return h;
}

function dateNavHtml(d,t){var label=d===t?'Today':d===addDays(t,1)?'Tomorrow':d===addDays(t,-1)?'Yesterday':fmtDate(d);return '<div class="datenav"><button class="ic" data-act="wod-shift" data-n="-1" aria-label="Previous day"'+(d<=addDays(t,-30)?' disabled':'')+'>‹</button><button class="datelabel" data-act="wod-today" aria-label="Jump to today">'+esc(label)+'</button><button class="ic" data-act="wod-shift" data-n="1" aria-label="Next day"'+(d>=addDays(t,14)?' disabled':'')+'>›</button></div>'}
function entryLine(e,withName){var main=e.scoring==='note'?esc(e.note):esc(fmtScore(e));var sub=(withName?esc(nameOf(e.memberId))+' · ':'')+(e.scoring!=='note'&&e.note?esc(e.note):'');return '<li><span><b class="mono">'+main+'</b>'+(e.division&&e.scoring!=='note'?' <span class="pill '+(e.division==='Rx'?'':'mute')+'">'+esc(e.division)+'</span>':'')+(sub?'<span class="sub">'+sub+'</span>':'')+'</span>'+(env.coach?'<button class="btn sm danger" data-act="entry-del" data-coll="'+e.coll+'" data-doc="'+esc(e.docId)+'" data-id="'+esc(e.id)+'">Delete</button>':'')+'</li>'}
var CHK='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>';
function setCard(d,bi,mine){
  var key=d+'|'+bi.id+'|'+(ui.who||''),dr=draftFor(key,bi),lg=mine[0],sc=bi.scoring;
  var rx=(bi.sets&&bi.repsT)?bi.sets+' X '+bi.repsT:(bi.sets?bi.sets+' SETS':(bi.repsT?bi.repsT+' REPS':''));
  var meta=[bi.tempo?'Tempo: '+bi.tempo:'',bi.rest?'Rest: '+bi.rest:''].filter(Boolean).join(' | ');
  var h='<section class="scard"><h4 class="sc-title">'+esc(bi.label)+'</h4>'+(bi.text?'<div class="sc-sub">'+esc(bi.text)+'</div>':'');
  if(demoOk(bi.demo))h+='<a class="sc-demo" href="'+esc(bi.demo)+'" target="_blank" rel="noopener noreferrer">Watch demo</a>';
  if(rx)h+='<div class="sc-rx">'+esc(rx)+'</div>';
  if(meta)h+='<div class="sc-meta">'+esc(meta)+'</div>';
  var fk=function(f,i){return ' data-dk="'+esc(key)+'" data-f="'+f+'"'+(i==null?'':' data-i="'+i+'"')+' data-fk="'+esc(key)+f+(i==null?'':i)+'"'};
  if(lg){
    if(lg.sets&&lg.sets.length){lg.sets.forEach(function(x,i){
      h+='<div class="setrow'+(sc==='load'?'':' rep')+'"><div class="setlab">Set '+(i+1)+'</div>'+(sc==='load'?'<div class="setin"><span>Load</span><b>'+esc(fmtVal('load',x.v,{entered:x.e,enteredUnit:lg.unit}))+'</b></div>':'')+'<div class="setin"><span>Reps</span><b>'+esc(x.r)+'</b></div><div class="setchk" aria-pressed="true">'+CHK+'</div></div>'})}
    else h+='<div class="setin wide"><span>Logged</span><b>'+esc(fmtScore(lg))+'</b></div>';
    if(lg.note&&sc!=='note')h+='<p class="sub" style="white-space:pre-wrap">'+esc(lg.note)+'</p>';
    h+='<div class="sc-foot"><span class="pill ok">Logged</span>'+(env.coach?'<button class="btn sm danger" data-act="entry-del" data-coll="'+lg.coll+'" data-doc="'+esc(lg.docId)+'" data-id="'+esc(lg.id)+'">Delete</button>':'<span class="sub" style="display:inline">Scores can be logged once. Ask a coach to fix a mistake.</span>')+'</div>';
  }else{
    if(sc==='load'||sc==='reps'){
      dr.sets.forEach(function(x,i){
        h+='<div class="setrow'+(sc==='load'?'':' rep')+'"><div class="setlab">Set '+(i+1)+'</div>'+(sc==='load'?'<label class="setin"><span>Load</span><input inputmode="decimal" placeholder="'+dr.unit+'" value="'+esc(x.l)+'"'+fk('l',i)+'></label>':'')+'<label class="setin"><span>Reps</span><input inputmode="numeric" placeholder="reps" value="'+esc(x.r)+'"'+fk('r',i)+'></label><button type="button" class="setchk" aria-label="Set '+(i+1)+' done" aria-pressed="'+(!!x.done)+'" data-act="set-done" data-dk="'+esc(key)+'" data-i="'+i+'">'+CHK+'</button></div>'});
      if(sc==='load')h+='<div class="sc-foot"><div class="seg" style="max-width:200px;margin:0" role="group" aria-label="Weight unit">'+['kg','lb'].map(function(u){return '<button type="button" data-act="draft-unit" data-dk="'+esc(key)+'" data-u="'+u+'" aria-pressed="'+(dr.unit===u)+'">'+u+'</button>'}).join('')+'</div></div>';
    }else if(sc==='time')h+='<label class="setin wide"><span>Time</span><input placeholder="12:45" value="'+esc(dr.t)+'"'+fk('t')+'></label>';
    else if(sc==='amrap')h+='<div class="setrow rep" style="grid-template-columns:1fr 1fr"><label class="setin"><span>Rounds</span><input inputmode="numeric" placeholder="6" value="'+esc(dr.r)+'"'+fk('r')+'></label><label class="setin"><span>Extra reps</span><input inputmode="numeric" placeholder="12" value="'+esc(dr.x)+'"'+fk('x')+'></label></div>';
    if(sc==='note')h+='<label class="setin wide"><span>Notes</span><textarea rows="3" placeholder="How it went, cues, what to fix"'+fk('note')+'>'+esc(dr.note)+'</textarea></label>';
    else h+='<input class="sc-note" placeholder="Note (optional)" value="'+esc(dr.note)+'" aria-label="Note"'+fk('note')+'>';
    h+='<button class="btn accent block" data-act="log-card" data-date="'+d+'" data-bid="'+esc(bi.id)+'">Log '+LOGWORD[sc]+'</button>';
  }
  return h+'</section>';
}
function viewWorkout(){
  var t=TODAY(),d=ui.wodDate||t,w=S.workouts[d];
  var h='<div class="sec-row"><h2 class="sec">Workout</h2>'+dateNavHtml(d,t)+'</div>';
  if(!w)return h+'<div class="empty"><b>Nothing posted</b>'+(env.coach?'Post the workout so members can log their scores.<br><button class="btn accent" data-act="wod-edit">Post workout</button>':'The coaches have not posted a workout for this day yet.')+'</div>';
  h+='<div class="stack"><div><h3 class="wk-title">'+esc(w.title||'Workout of the day')+'</h3><div style="margin-top:8px"><span class="pill '+(w.track==='Hyrox'?'hyrox':'')+'">'+esc(w.track||'')+'</span></div>'+(w.briefing?'<p class="briefing" style="margin-top:12px;border-left:3px solid var(--accent);padding-left:10px;white-space:pre-wrap">'+esc(w.briefing)+'</p>':'')+'</div>';
  if(env.coach&&!ui.who)h+='<p class="note">Choose a member at the top to see and log scores for them.</p>';
  if(env.canWrite===false)h+='<p class="note">You have view-only access. Ask a coach for contributor access to log scores.</p>';
  (w.blocks||[]).forEach(function(b,i){
    var bi=blockInfo(w,b,i),es=entriesFor(d,bi.id),mine=ui.who?es.filter(function(e){return e.memberId===ui.who}):[];
    if(bi.scoring!=='none'&&bi.type!=='metcon'){h+=setCard(d,bi,mine);return}
    var tl=BTYPES.filter(function(x){return x[0]===bi.type})[0];
    h+='<section class="blkcard"><div class="blkhead"><h4>'+esc(bi.label)+'</h4>'+((tl&&tl[1].toLowerCase()!==bi.label.toLowerCase())?'<span class="pill mute">'+esc(tl[1])+'</span>':'')+'</div><pre>'+esc(bi.text)+'</pre>';
    if(bi.scoring!=='none'){
      if(mine.length)h+='<ul class="mylogs">'+mine.map(function(e){return entryLine(e,false)}).join('')+'</ul>';
      h+='<div class="acts-row" style="margin:0">'+(mine.length?'<span class="pill ok">Logged</span>':'<button class="btn sm accent" data-act="score-log" data-date="'+d+'" data-bid="'+esc(bi.id)+'">Log '+LOGWORD[bi.scoring]+'</button>')+((bi.type==='metcon'&&bi.scoring!=='note')?'<button class="btn sm ghost" data-act="goto-board" data-date="'+d+'" data-bid="'+esc(bi.id)+'">Leaderboard ('+rankEntries(es).length+')</button>':'')+'</div>';
    }
    h+='</section>'});
  if(w.scaling)h+='<section class="blkcard"><div class="blkhead"><h4>Scaling</h4></div><pre>'+esc(w.scaling)+'</pre></section>';
  if(env.coach)h+='<div class="acts-row"><button class="btn ghost" data-act="wod-edit">Edit workout</button></div>';
  return h+'</div>';
}
function viewBoard(){
  var t=TODAY(),d=ui.wodDate||t,w=S.workouts[d];
  var h='<div class="sec-row"><h2 class="sec">Metcon board</h2>'+dateNavHtml(d,t)+'</div>';
  var mets=[];((w&&w.blocks)||[]).forEach(function(b,i){var bi=blockInfo(w,b,i);if(bi.type==='metcon'&&bi.scoring!=='none'&&bi.scoring!=='note')mets.push(bi)});
  if(!mets.length)return h+'<div class="empty"><b>No scored metcon</b>'+(w?'This day has no scored metcon.':'Nothing is posted for this day.')+' Use the arrows to find another day.</div>';
  var cur=mets.filter(function(x){return x.id===ui.boardBlock})[0]||mets[0];ui.boardBlock=cur.id;
  if(mets.length>1)h+='<div class="chips">'+mets.map(function(x){return '<button class="chip" data-act="board-block" data-bid="'+esc(x.id)+'" aria-pressed="'+(x.id===cur.id)+'">'+esc(x.label)+'</button>'}).join('')+'</div>';
  var rule={time:'Fastest time wins.',amrap:'Most rounds and reps wins.',reps:'Most reps wins.',load:'Heaviest weight wins.'}[cur.scoring];
  h+='<div class="card stack" style="margin-bottom:12px"><div><b style="font:800 22px var(--font-display);text-transform:uppercase;letter-spacing:.04em">'+esc(cur.label)+'</b><span class="sub">'+esc(w.title||'')+' · '+rule+' Rx ranks above Scaled.</span></div><div>'+((ui.who&&entriesFor(d,cur.id).some(function(e){return e.memberId===ui.who}))?'<span class="pill ok">You logged this</span>':'<button class="btn sm accent" data-act="score-log" data-date="'+d+'" data-bid="'+esc(cur.id)+'">Log my score</button>')+'</div></div>';
  h+='<div class="seg" role="group" aria-label="Division">'+['All','Rx','Scaled'].map(function(x){return '<button data-act="board-div" data-v="'+x+'" aria-pressed="'+(ui.div===x)+'">'+x+'</button>'}).join('')+'</div>';
  var ranked=rankEntries(entriesFor(d,cur.id)).filter(function(e){return ui.div==='All'||e.division===ui.div});
  if(!ranked.length)return h+'<div class="empty"><b>No scores yet</b>Be the first on the board.</div>';
  return h+'<ul class="list">'+ranked.map(function(e,i){var me=e.memberId===ui.who;return '<li class="lb'+(me?' me':'')+'"><span class="rank'+(i===0?' r1':'')+'">'+(i+1)+'</span><span><span class="nm">'+esc(nameOf(e.memberId))+(me?' (you)':'')+'</span><span class="sub">'+esc(e.division||'')+(e.note?' · '+esc(e.note):'')+'</span></span><span class="val">'+esc(fmtScore(e))+'</span></li>'}).join('')+'</ul>';
}
function viewClasses(){
  var t=TODAY();var sel=ui.classDate;if(!sel||sel<t||sel>addDays(t,6))sel=ui.classDate=t;
  var h='<div class="days" role="group" aria-label="Pick a day">';
  for(var i=0;i<7;i++){var d=addDays(t,i);h+='<button class="day" data-act="class-date" data-date="'+d+'" aria-pressed="'+(d===sel)+'"><span>'+(i===0?'Today':DOW[parseD(d).getDay()])+'</span><b>'+parseD(d).getDate()+'</b></button>'}
  h+='</div>';
  if(env.canWrite===false)h+='<p class="note" style="margin-bottom:12px">You have view-only access. Ask a coach for contributor access to reserve classes.</p>';
  else if(!ui.who)h+='<p class="note" style="margin-bottom:12px">Choose your name at the top to reserve a spot.</p>';
  var cl=classesOn(sel);
  if(!cl.length)h+='<div class="empty"><b>No classes</b>Nothing scheduled for '+DOWF[parseD(sel).getDay()]+'.</div>';
  else h+='<ul class="list">'+cl.map(function(c){
    var rs=resvFor(c.id,sel),mine=ui.who&&rs.some(function(r){return r.memberId===ui.who}),full=rs.length>=c.capacity,started=sel===t&&c.time<=nowHM();
    var btn=started?'<button class="btn sm ghost" disabled>Started</button>':mine?'<button class="btn sm ghost" data-act="cancel" data-cls="'+c.id+'" data-date="'+sel+'">Cancel spot</button>':full?'<button class="btn sm ghost" disabled>Full</button>':'<button class="btn sm accent" data-act="reserve" data-cls="'+c.id+'" data-date="'+sel+'">Reserve</button>';
    var pct=Math.min(100,Math.round(rs.length/c.capacity*100));
    return '<li class="cls"><span class="t">'+timeHtml(c.time)+'</span><div><div class="head"><span class="nm">'+esc(c.name)+'</span><span class="pill '+(c.track==='Hyrox'?'hyrox':'')+'">'+esc(c.track)+'</span>'+(mine?'<span class="pill ok">You’re in</span>':'')+'</div><span class="sub">'+esc(c.coach||'')+'</span></div>'
      +'<div class="foot"><div class="capwrap"><div class="cap'+(full?' full':'')+'"><i style="width:'+pct+'%"></i></div><div class="capnum">'+rs.length+' / '+c.capacity+' booked</div></div>'+btn+'</div>'
      +(env.coach&&rs.length?'<div class="who-in">In: '+rs.map(function(r){return esc(firstName(r.memberId))}).join(', ')+'</div>':'')+'</li>'}).join('')+'</ul>';
  if(env.coach)h+='<div class="acts-row" style="margin-top:16px"><button class="btn ghost" data-act="sched-mgr">Edit weekly schedule</button></div>';
  return h;
}

function viewPrs(){
  var h='<div class="sec-row"><h2 class="sec">Personal records</h2><button class="btn sm accent" data-act="pr-log">Log a PR</button></div><div class="seg" style="max-width:180px" role="group" aria-label="Weight unit"><button data-act="unit" data-u="kg" aria-pressed="'+(ui.unit==='kg')+'">kg</button><button data-act="unit" data-u="lb" aria-pressed="'+(ui.unit==='lb')+'">lb</button></div>';
  if(env.canWrite===false)h+='<p class="note" style="margin-bottom:12px">You have view-only access. Ask a coach for contributor access to log PRs.</p>';
  if(env.coach)h+='<div class="seg" role="group" aria-label="PR view">'+[['mine','My PRs'],['board','Leaderboard'],['recent','Recent']].map(function(x){return '<button data-act="pr-view" data-v="'+x[0]+'" aria-pressed="'+(ui.prView===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(!env.coach||ui.prView==='mine'){
    if(!ui.who)return h+'<div class="empty"><b>Who are you?</b>Choose your name at the top to see your records.</div>';
    var bs=bestsFor(ui.who);
    if(!bs.length)return h+'<div class="empty"><b>No PRs yet</b>Hit a new max? Log it so the box can cheer.<br><button class="btn accent" data-act="pr-log">Log your first PR</button></div>';

function mirrorFor(mid){var m=S.members[mid],d=S.dues[mid],g=S.settings.gym||{};return {memberId:mid,plan:m.plan||'',active:!!m.active,fee:d.fee,nextDue:d.nextDue,payments:(d.payments||[]).slice(0,6).map(function(p){return {date:p.date,amount:p.amount,method:p.method||'',months:p.months||1}}),payNote:g.payNote||'',leadDays:Number(g.leadDays)||3}}
function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+stable(o[k])}).join(',')+'}';return JSON.stringify(o)}

async function syncMirrors(){
  if(syncing||!env.coach||env.mode!=='live')return;
  if(!['dues','claims','members','settings','mydues'].every(function(k){return env.loaded[k]}))return;
  syncing=true;
  try{var us=Object.keys(S.claims);for(var i=0;i<us.length;i++){var u=us[i],mid=S.claims[u].memberId;if(!S.members[mid]||!S.dues[mid])continue;var want=mirrorFor(mid);if(stable(want)!==stable(S.mydues[u]||null))await put('mydues',u,want)}}catch(e){}finally{syncing=false}
}

  var fn=ACT[el.dataset.act];if(fn){Promise.resolve(fn(el.dataset,el)).catch(function(err){toast(errMsg(err))})}
});

  else if(e.target.classList&&e.target.classList.contains('blk-score')){var c2=e.target.closest('.blkedit');c2.querySelector('.blk-rx').hidden=!(e.target.value==='load'||e.target.value==='reps')}
  else if(id==='pd-months'){var a=$('pd-amt');a.value=Number(a.dataset.fee)*Number(e.target.value);var sheetBtn=document.querySelector('[data-act="paid-save"]');paidSync(sheetBtn.dataset.id)}
});
document.addEventListener('input',function(e){var t=e.target;if(!t||!t.dataset||!t.dataset.dk)return;var dr=ui.drafts[t.dataset.dk];if(!dr)return;var f=t.dataset.f;if(f==='l'||f==='r'&&t.dataset.i!=null){var x=dr.sets[Number(t.dataset.i)];if(x)x[f]=t.value}else dr[f]=t.value});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

/* ---------- boot ---------- */
async function resolveNames(){
  if(!env.user)return;
  var ids=[];Object.keys(S.announcements).forEach(function(k){var b=S.announcements[k].by;if(b&&ids.indexOf(b)<0)ids.push(b)});
  if(!ids.length)return;
  try{var ps=await env.user.profiles(ids);var ch=false;ids.forEach(function(i){var n=(ps[i]&&ps[i].name)||'';if(S.names[i]!==n){S.names[i]=n;ch=true}});if(ch)scheduleRender()}catch(e){}
}
function subscribeAll(){
  var db=env.db,t=TODAY();
  var defs=[['members',db.collection('members')],['schedule',db.collection('schedule')],['claims',db.collection('claims')],['prs',db.collection('prs')],['reservations',db.collection('reservations')],['workouts',db.collection('workouts').where('date','>=',addDays(t,-30))],['announcements',db.collection('announcements')],['mydues',db.collection('mydues')],['scores',db.collection('scores')],['logs',db.collection('logs')]];
  if(env.coach)defs.push(['dues',db.collection('dues')],['settings',db.collection('settings')]);
  env.expect=defs.map(function(d){return d[0]});
  defs.forEach(function(d){
    d[1].onSnapshot(function(snap){var o={};snap.docs.forEach(function(x){o[x.id]=x.data()});S[d[0]]=o;env.loaded[d[0]]=true;if(d[0]==='announcements')resolveNames();if(env.coach)syncMirrors();scheduleRender()},
      function(err){env.loaded[d[0]]=true;env.errs[d[0]]=(err&&err.code)||'error';scheduleRender()});
  });
}
/* ---------- Supabase ---------- */
function makeDb(sb){
  var L={},timers={};
  function fetchInto(name){
    var h=L[name];if(!h)return Promise.resolve();
    return sb.from('docs').select('id,data').eq('collection',name).limit(5000).then(function(r){
      if(r.error){h.fail({code:r.error.code||'error'});return}
      var rows=r.data||[];
      if(h.filt)rows=rows.filter(function(x){return String((x.data||{})[h.filt.f]||'')>=h.filt.v});
      h.ok({docs:rows.map(function(x){return {id:x.id,data:function(){return x.data}}})});
    },function(){h.fail({code:'network'})});
  }
  function later(name){clearTimeout(timers[name]);timers[name]=setTimeout(function(){fetchInto(name)},250)}
  function all(){Object.keys(L).forEach(function(n){fetchInto(n)})}
  var chan=null;
  function listen(){
    if(chan)return;
    try{chan=sb.channel('forge-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){
      var n=(p.new&&p.new.collection)||(p.old&&p.old.collection);if(n)later(n);else all()
    }).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},function(){if(env.coach)loadProfiles()}).subscribe()}catch(e){}
    setInterval(function(){if(!document.hidden){all();if(env.coach)loadProfiles()}},30000);
  }
  function col(name){
    var api={
      where:function(f,op,v){api._f={f:f,v:v};return api},
      doc:function(id){return {
        set:async function(data){var r=await sb.from('docs').upsert({collection:name,id:id,data:data,updated_at:new Date().toISOString()});if(r.error)throw r.error;fetchInto(name)},
        update:async function(data){var g=await sb.from('docs').select('data').eq('collection',name).eq('id',id).maybeSingle();if(g.error)throw g.error;var r=await sb.from('docs').upsert({collection:name,id:id,data:Object.assign({},g.data&&g.data.data,data),updated_at:new Date().toISOString()});if(r.error)throw r.error;fetchInto(name)},
        delete:async function(){var r=await sb.from('docs').delete().eq('collection',name).eq('id',id);if(r.error)throw r.error;fetchInto(name)}
      }},
      onSnapshot:function(ok,fail){L[name]={ok:ok,fail:fail,filt:api._f};fetchInto(name);listen()}
    };
    return api;
  }
  return {collection:col};
}
function pendingProfiles(){return (env.profiles||[]).filter(function(p){return p.status==='pending'})}
async function loadProfiles(){
  if(!env.sb||!env.coach)return;
  var r=await env.sb.from('profiles').select('*').order('created_at',{ascending:true});
  if(!r.error){env.profiles=r.data||[];scheduleRender()}
}
function authView(){
  var su=ui.authMode==='signup';
  return '<div class="sec-row"><h2 class="sec">'+(su?'Create your account':'Sign in')+'</h2></div><p class="muted" style="margin-bottom:12px">'+(su?'Sign up with your email. A coach approves new accounts before you can get in.':'Members and coaches of Forge Davao sign in with email and password.')+'</p>'
    +(su?F('Full name','au-name','<input id="au-name" autocomplete="name">'):'')
    +F('Email','au-email','<input id="au-email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false">')
    +F('Password','au-pass','<input id="au-pass" type="password" autocomplete="'+(su?'new-password':'current-password')+'">',su?'At least 8 characters.':'')
    +'<div class="acts-row"><button class="btn accent" data-act="'+(su?'auth-signup':'auth-login')+'">'+(su?'Sign up':'Sign in')+'</button><button class="btn ghost" data-act="auth-mode">'+(su?'I already have an account':'Create an account')+'</button></div>'
    +(su?'':'<p style="margin-top:14px"><button class="btn sm ghost" data-act="auth-reset">Forgot password</button></p>');
}
function gatedView(){
  var rej=env.mode==='rejected';
  return '<div class="empty"><b>'+(rej?'Access was not approved':'Waiting for coach approval')+'</b>'+(rej?'Please talk to a coach at the gym.':'Your account '+esc(env.email||'')+' is created. A coach will approve it soon. Tap Check again after they do.')+'<div class="acts-row" style="justify-content:center"><button class="btn accent" data-act="recheck">Check again</button></div></div>';
}
function openApprovals(){
  var ps=env.profiles||[],pend=ps.filter(function(p){return p.status==='pending'}),rest=ps.filter(function(p){return p.status!=='pending'&&p.id!==env.uid});
  var taken={};Object.keys(S.claims).forEach(function(u){taken[S.claims[u].memberId]=1});
  var free=members().filter(function(m){return m.active&&!taken[m.id]});
  var h='<h3>Sign-ups and access</h3>';
  h+=pend.length?pend.map(function(p){
    return '<div class="blkedit"><b>'+esc(p.name||'(no name)')+'</b><div class="muted" style="font-size:13px;margin-bottom:8px">'+esc(p.email)+'</div>'
      +'<label>Role</label><select id="ap-r-'+esc(p.id)+'"><option value="member">Member</option><option value="coach">Coach</option></select>'
      +'<label style="margin-top:8px">Link to member record (members)</label><select id="ap-m-'+esc(p.id)+'"><option value="">Choose…</option>'+free.map(function(m){return '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>'}).join('')+'<option value="__new">Add as a new member</option></select>'
      +'<div class="acts-row"><button class="btn accent" data-act="approve" data-u="'+esc(p.id)+'">Approve</button><button class="btn danger" data-act="reject" data-u="'+esc(p.id)+'">Reject</button></div></div>'}).join(''):'<p class="muted">No one is waiting.</p>';
  if(rest.length)h+='<div class="sec-row" style="margin:20px 0 6px"><h2 class="sec" style="font-size:18px">Everyone else</h2></div><ul class="hist">'+rest.map(function(p){return '<li><span class="nm">'+esc(p.name||p.email)+' <span class="pill '+(p.status==='approved'?'ok':'mute')+'">'+esc(p.status==='approved'?p.role:p.status)+'</span></span>'+(p.status==='approved'?'<button class="btn sm danger" data-act="revoke" data-u="'+esc(p.id)+'">Revoke</button>':'<button class="btn sm ghost" data-act="reapprove" data-u="'+esc(p.id)+'">Reopen</button>')+'</li>'}).join('')+'</ul>';
  h+='<div class="acts-row"><button class="btn ghost" data-act="close">Close</button></div>';
  sheet(h);
}
async function setProfile(uid,patchObj){var r=await env.sb.from('profiles').update(patchObj).eq('id',uid);if(r.error)throw r.error;await loadProfiles()}
Object.assign(ACT,{
  'auth-mode':function(){ui.authMode=ui.authMode==='signup'?'login':'signup';render()},
  'auth-login':async function(){
    var em=V('au-email').trim(),pw=V('au-pass');if(!em||!pw){toast('Enter your email and password.');return}
    var r=await env.sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)toast(/confirm/i.test(r.error.message)?'Confirm your email first, then sign in.':'Wrong email or password.')},
  'auth-signup':async function(){
    var nm=V('au-name').trim(),em=V('au-email').trim(),pw=V('au-pass');
    if(!nm){toast('Add your full name.');return}if(!em){toast('Add your email.');return}if(pw.length<8){toast('Use at least 8 characters.');return}
    var r=await env.sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});
    if(r.error){toast(r.error.message);return}
    if(!r.data.session){ui.authMode='login';render();toast('Check your email to confirm, then sign in. A coach will approve you.')}},
  'auth-reset':async function(){var em=V('au-email').trim();if(!em){toast('Type your email first.');return}
    var r=await env.sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});toast(r.error?r.error.message:'Check your email for a reset link.')},
  'sign-out':async function(){if(env.sb)await env.sb.auth.signOut();location.reload()},
  recheck:function(){return startSession(env.session)},
  approvals:function(){return loadProfiles().then(openApprovals)},
  approve:async function(d){
    var role=V('ap-r-'+d.u),mid=V('ap-m-'+d.u),p=(env.profiles||[]).filter(function(x){return x.id===d.u})[0];if(!p)return;
    if(role==='member'&&!mid){toast('Choose which member this is, or add a new one.');return}
    await safely(async function(){
      if(role==='member'){
        if(mid==='__new'){mid=rid('m_');await put('members',mid,{name:p.name||p.email,plan:'',active:true,joined:TODAY()});var nd=addDays(TODAY(),30);await put('dues',mid,{fee:0,nextDue:nd,dueDay:parseD(nd).getDate(),phone:'',payments:[]})}
        await put('claims',d.u,{memberId:mid})}
      await setProfile(d.u,{status:'approved',role:role,member_id:role==='member'?mid:null});
    });
    closeSheet();openApprovals();toast('Approved.')},
  reject:async function(d){if(await safely(function(){return setProfile(d.u,{status:'rejected'})})){closeSheet();openApprovals()}},
  revoke:async function(d,el){if(!armed(el,'Tap again to revoke'))return;if(await safely(function(){return setProfile(d.u,{status:'rejected'})})){closeSheet();openApprovals()}},
  reapprove:async function(d){if(await safely(function(){return setProfile(d.u,{status:'pending'})})){closeSheet();openApprovals()}}
});
async function startSession(session){
  env.session=session;
  if(!session){env.mode='auth';env.uid=null;env.coach=false;render();return}
  env.uid=session.user.id;env.email=session.user.email;
  var r=await env.sb.from('profiles').select('*').eq('id',env.uid).maybeSingle();
  var p=r.data;
  if(r.error||!p){env.mode='pending';env.coach=false;render();return}
  env.profile=p;
  if(p.status!=='approved'){env.mode=p.status==='rejected'?'rejected':'pending';env.coach=false;render();return}
  env.coach=p.role==='coach';env.canWrite=true;
  if(!env.db)env.db=makeDb(env.sb);
  env.mode='live';
  if(!env.subbed){env.subbed=true;subscribeAll()}
  if(env.coach)loadProfiles();
  render();
}
async function boot(){
  whoInit();if(store.get('forge.unit')==='lb')ui.unit='lb';var t=store.get('forge.tab');if(t&&TABS.some(function(x){return x.id===t}))ui.tab=t;
  render();
  var cfg=window.FORGE_CONFIG||{};
  var ok=cfg.url&&cfg.anonKey&&!/YOUR_/.test(cfg.url+cfg.anonKey)&&window.supabase&&window.supabase.createClient;
  if(!ok){
    env.mode='demo';env.coach=true;env.canWrite=true;env.uid='demo';
    var d=sampleData(TODAY());Object.keys(d).forEach(function(k){S[k]=d[k]});
    if(!ui.who||!S.members[ui.who])ui.who=null;
    render();return;
  }
  env.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  env.sb.auth.onAuthStateChange(function(ev,session){
    if(ev==='SIGNED_OUT'){location.reload();return}
    if(ev==='SIGNED_IN'&&session&&session.user.id!==env.uid)setTimeout(function(){startSession(session)},0);
  });
  var g=await env.sb.auth.getSession();
  await startSession(g.data&&g.data.session);
}
boot();
setInterval(function(){if(!document.hidden&&!$('sheet').firstChild)scheduleRender()},60000);
})();
